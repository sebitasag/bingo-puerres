<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verb Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e4f5; font-family: 'Nunito', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page {
    width: 210mm; height: 297mm; margin: 0 auto; padding: 12mm 12mm 9mm;
    background: #fffdf7;
    background-image: radial-gradient(#f1e6c8 1.2px, transparent 1.2px);
    background-size: 9mm 9mm;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .page::before, .page::after { content: ""; position: absolute; border-radius: 50%; z-index: 0; }
  .page::before { width: 90mm; height: 90mm; background: #ffd6e0; top: -45mm; left: -35mm; opacity: .6; }
  .page::after  { width: 80mm; height: 80mm; background: #c9f0e4; bottom: -40mm; right: -30mm; opacity: .7; }
  header { text-align: center; position: relative; z-index: 1; margin-bottom: 4mm; }
  .sub { font-family: 'Fredoka'; font-weight: 500; letter-spacing: 3px; color: #6c5ce7; font-size: 13pt; text-transform: uppercase; }
  .letters { display: flex; justify-content: center; gap: 3mm; margin: 2mm 0 1mm; }
  .letters span {
    font-family: 'Fredoka'; font-weight: 700; font-size: 34pt; color: #fff;
    width: 33mm; height: 18mm; display: grid; place-items: center; border-radius: 5mm;
    box-shadow: 0 1.5mm 0 rgba(0,0,0,.15);
  }
  .letters span:nth-child(1){background:#ff6b8b}.letters span:nth-child(2){background:#ffa94d}
  .letters span:nth-child(3){background:#ffd43b;color:#5a4500}.letters span:nth-child(4){background:#38d9a9}
  .letters span:nth-child(5){background:#6c5ce7}
  .name { display:flex; gap:6mm; justify-content:center; font-weight:800; color:#555; font-size:10pt; margin-top:2mm; }
  .name i { display:inline-block; width:55mm; border-bottom: 1.5px dashed #aaa; }
  .grid {
    flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
    gap: 3mm; position: relative; z-index: 1; min-height: 0;
  }
  .cell {
    background: #fff; border: 2px solid #ece6ff; border-radius: 4mm; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.5mm 1mm 2mm; box-shadow: 0 1mm 0 #ece6ff; min-height: 0;
  }
  .cell img { flex: 1; min-height: 0; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4mm; margin-bottom: 1mm; }
  .verb { font-family: 'Fredoka'; font-weight: 700; font-size: 15pt; color: #2d2a4a; line-height: 1.1; }
  .free { background: linear-gradient(135deg,#6c5ce7,#ff6b8b); border: none; justify-content:center; }
  .free { position: relative; background: radial-gradient(circle at 30% 25%, #a29bfe, #6c5ce7 45%, #e84393 100%);
    border: 2.5px dashed rgba(255,255,255,.7); outline: 2px solid #6c5ce7; box-shadow: 0 1.2mm 0 #4b3fc4; }
  .free::before { content: "✦ ✧ ✦"; position: absolute; top: 2mm; color: rgba(255,255,255,.8); font-size: 8pt; letter-spacing: 2mm; }
  .free::after { content: "✧ ✦ ✧"; position: absolute; bottom: 2mm; color: rgba(255,255,255,.8); font-size: 8pt; letter-spacing: 2mm; }
  .free .star { font-size: 34pt; color: #ffd43b; line-height: 1; text-shadow: 0 0 4mm rgba(255,212,59,.9), 0 .8mm 0 #e0a800; }
  .free .verb { color:#fff; font-size: 21pt; letter-spacing: 2px; text-shadow: 0 .8mm 0 rgba(0,0,0,.2); }
  .free .tag { margin-top: 1mm; background: #fff; color: #6c5ce7; font-family: 'Fredoka'; font-weight: 700;
    font-size: 7pt; letter-spacing: 1.5px; padding: .6mm 2.5mm; border-radius: 3mm; }
  footer small { display: block; font-size: 10pt; letter-spacing: 3px; color: #ff6b8b; margin-top: 1mm; }
  footer {
    position: relative; z-index: 1; text-align: center; margin-top: 4mm;
    font-family: 'Fredoka'; font-weight: 700; font-size: 14pt; letter-spacing: 4px; color: #6c5ce7;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="sub">English Verbs</div>
    <div class="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
    <div class="name">Name: <i></i> Card Nº: <i style="width:20mm"></i></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>SEBASTIAN GUERRERO 11<small>TEACHER MARIA I. PUERRES</small></footer>
</div>
<script>
const B = "https://img.magnific.com/free-vector/";
const verbs = [
  ["steal","cute-thief-steal-money-from-man-strapped-chair-cartoon-vector-icon-illustration-people-finance_138676-13631.jpg"],
  ["weep","cute-boy-crying-cartoon-vector-icon-illustration-people-nature-icon-isolated-flat-vector_138676-13545.jpg"],
  ["fight","cute-man-fighting-cartoon-vector-icon-illustration-people-sport-icon-isolated-flat-vector_138676-12895.jpg"],
  ["fly","cute-bird-flying-cartoon-vector-icon-illustration-animal-nature-icon-isolated-flat-vector_138676-13886.jpg"],
  ["catch","cute-polar-bear-catching-fish-cartoon-vector-icon-illustration-animal-food-icon-concept-isolated_138676-7311.jpg"],
  ["ride","cute-boy-riding-bicycle-cartoon-vector-icon-illustration-people-transportation-icon-concept-isolated-premium-vector-flat-cartoon-style_138676-3948.jpg"],
  ["sing","cute-girl-singing-with-microphone-cartoon-vector-icon-illustration-people-music-icon-isolated-flat_138676-17435.jpg"],
  ["sleep","cute-koala-sleeping-pillow-cartoon-vector-icon-illustration-animal-nature-icon-concept-isolated_138676-4806.jpg"],
  ["drink","cute-grandfather-drink-coffee-cartoon-vector-icon-illustration-people-drink-icon-concept-isolated_138676-9913.jpg"],
  ["swim","cute-shiba-inu-dog-snorkeling-waving-hand-cartoon-vector-icon-illustration-animal-holiday-icon_138676-4990.jpg"],
  ["grow","cute-girl-planting-crops-cartoon-icon-illustration-people-nature-icon-concept-isolated-flat-cartoon-style_138676-2109.jpg"],
  ["shine","seasonal-sun-smiling-kawaii_24908-82214.jpg"],
  null,
  ["sweep","cute-man-cleaning-with-broom-duster-cartoon-vector-icon-illustration-people-healthy-isolated_138676-15102.jpg"],
  ["hurt","cute-man-with-crutch-bandage-leg-cartoon-vector-icon-illustration-people-nature-isolated_138676-6222.jpg"],
  ["burn","cute-house-burning-cartoon-vector-icon-illustration-people-object-icon-isolated-flat-vector_138676-14426.jpg"],
  ["shout","cute-girl-holding-megaphone-cartoon-vector-icon-illustration-people-technology-icon-concept-isolated-premium-vector-flat-cartoon-style_138676-3983.jpg"],
  ["paint","cute-astronaut-painting-cartoon-vector-icon-illustration-science-technology-icon-isolated-flat_138676-11429.jpg"],
  ["pray","cute-boy-moslem-prayer-cartoon-vector-icon-illustration-people-religion-icon-concept-isolated-flat_138676-7943.jpg"],
  ["lift","cute-man-lifting-barbell-gym-cartoon-vector-icon-illustration-people-sport-icon-concept-isolated_138676-6223.jpg"],
  ["skate","cute-boy-playing-skateboard-cartoon-vector-icon-illustration-people-sport-icon-isolated-flat-vector_138676-17450.jpg"],
  ["float","cute-koala-floating-with-balloon-cartoon-icon-illustration-animal-nature-icon-concept-isolated-flat-cartoon-style_138676-2349.jpg"],
  ["sweat","cute-boy-stiflingly-hot-holding-handheld-fan-cartoon-vector-icon-illustration-people-nature-flat_138676-8421.jpg"],
  ["dream","cute-dog-dream-bone-cartoon-vector-icon-illustration-animal-nature-icon-concept-isolated-premium-vector-flat-cartoon-style_138676-4119.jpg"],
  ["hang","cute-children-clothes-hanging-line-outdoor-scene_1308-54582.jpg"]
];
document.getElementById("grid").innerHTML = verbs.map(v => v
  ? `<div class="cell"><img src="${B}${v[1]}?w=360" alt="${v[0]}"><div class="verb">${v[0]}</div></div>`
  : `<div class="cell free"><div class="star">★</div><div class="verb">FREE</div><div class="tag">SPACE</div></div>`
).join("");
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGLISH BINGO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="verbs.js"></script>
<style>
  :root { --bg1:#2b1d6b; --bg2:#6c5ce7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; font-family: 'Fredoka', sans-serif; color: #fff; overflow-x: hidden;
    background: linear-gradient(180deg, #0b1030 0%, #151a4a 55%, #22184f 100%);
  }
  /* Fondo: luces de colores que flotan + estrellas */
  .confetti-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
  .confetti-bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 22s ease-in-out infinite alternate; }
  .confetti-bg i:nth-child(1) { width: 520px; height: 520px; background: #ff4d6d; left: -140px; top: -120px; }
  .confetti-bg i:nth-child(2) { width: 480px; height: 480px; background: #4f7cff; right: -120px; top: 20%; animation-duration: 26s; animation-delay: -6s; }
  .confetti-bg i:nth-child(3) { width: 420px; height: 420px; background: #1fc98e; left: 30%; bottom: -200px; opacity: .3; animation-duration: 30s; animation-delay: -12s; }
  .confetti-bg i:nth-child(4) { width: 300px; height: 300px; background: #ffc233; left: 45%; top: -160px; opacity: .25; animation-duration: 24s; animation-delay: -3s; }
  @keyframes drift { to { transform: translate(120px, 80px) scale(1.15); } }
  .confetti-bg b { position: absolute; inset: 0;
    background-image: radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 35%, #fff, transparent), radial-gradient(1px 1px at 80% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, #fff, transparent), radial-gradient(1px 1px at 70% 85%, #fff, transparent),
      radial-gradient(1px 1px at 20% 90%, #fff, transparent), radial-gradient(1.5px 1.5px at 42% 8%, #fff, transparent);
    background-size: 420px 420px; opacity: .6; animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { to { opacity: .25; } }
  /* Título producido */
  .title { position: relative; display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    gap: 18px; margin: 22px auto 22px; padding: 0 16px; font-size: clamp(40px, 6.5vw, 80px); line-height: 1; }
  .eng { font-weight: 700; letter-spacing: 3px; position: relative;
    background: linear-gradient(180deg, #6fb6ff 0%, #4f7cff 50%, #6a4dff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 0; filter: drop-shadow(0 4px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
      drop-shadow(0 8px 0 #2f3d9e) drop-shadow(0 14px 18px rgba(47,61,158,.35));
    animation: engIn .8s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes engIn { from { transform: translateY(-40px) scale(.7); opacity: 0; } }
  .eng::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%) no-repeat;
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .balls { display: flex; gap: .12em; }
  .balls i { font-style: normal; width: 1.15em; height: 1.15em; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .78em; position: relative;
    background: radial-gradient(circle at 30% 24%, #fff 0 7%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 80%, #000));
    color: transparent; box-shadow: inset 0 -5px 10px rgba(0,0,0,.12), 0 8px 0 color-mix(in srgb, var(--c) 70%, #000), 0 14px 20px rgba(40,60,140,.25);
    animation: ballIn .9s var(--d) cubic-bezier(.3,1.6,.5,1) both, hop 3s calc(1.2s + var(--d)) ease-in-out infinite; }
  .balls i::after { content: ""; position: absolute; width: 62%; height: 62%; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle at 40% 35%, #fff 60%, #eceef8); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 80%, #000); }
  .balls i b { position: relative; z-index: 1; color: color-mix(in srgb, var(--c) 55%, #000); font-size: .62em; }
  @keyframes ballIn { from { transform: translateY(-120px) rotate(-180deg) scale(.4); opacity: 0; } }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-14px) rotate(-6deg); } 90% { transform: translateY(0) rotate(3deg); } }
  .spark { position: absolute; color: #ffc233; font-size: 28px; text-shadow: 0 0 8px #fff; animation: tw 2s ease-in-out infinite; }
  .spark.s1 { left: 18%; top: -6px; } .spark.s2 { right: 16%; top: 4px; animation-delay: .7s; color: #ff5fa2; }
  .spark.s3 { left: 47%; bottom: -14px; animation-delay: 1.3s; color: #2ee6a6; font-size: 22px; }
  .credit { text-align: center; opacity: .85; letter-spacing: 3px; font-size: 14px; }
  .credit b { color: #ffd43b; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.15fr); gap: 28px; max-width: 1300px; margin: 20px auto; padding: 0 16px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* Tómbola */
  .machine { display: flex; flex-direction: column; align-items: center; }
  .cage-wrap { position: relative; width: min(380px, 80vw); aspect-ratio: 1; }
  .cage {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,.06) 60%);
    border: 10px solid #ffd43b; box-shadow: 0 0 0 6px #e0a800, 0 20px 40px rgba(0,0,0,.4), inset 0 0 40px rgba(255,255,255,.25);
    overflow: hidden;
  }
  .spokes { position:absolute; inset:0; border-radius:50%; will-change: transform;
    background: repeating-conic-gradient(rgba(255,255,255,.22) 0 1.5deg, transparent 1.5deg 30deg); }
  .glass { position:absolute; inset:0; border-radius:50%; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse 40% 25% at 32% 22%, rgba(255,255,255,.55), transparent 70%); }
  /* Balotas con brillo de bola real */
  .mini, .flyer, .ball {
    border-radius: 50%; display: grid; place-items: center; position: relative;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.95) 0 6%, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 85%, #fff) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.35);
  }
  .mini { position: absolute; left: 0; top: 0; width: 36px; height: 36px; font-weight: 700; will-change: transform; z-index: 2; }
  .mini span, .flyer span, .ball span {
    background: radial-gradient(circle at 40% 35%, #fff 60%, #e9e9f2); color: color-mix(in srgb, var(--c) 75%, #000);
    border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, #000), 0 1px 2px rgba(0,0,0,.2);
  }
  .mini span { width: 19px; height: 19px; font-size: 12px; }
  .flyer { position: fixed; z-index: 30; pointer-events: none; will-change: transform; }
  .flyer span { width: 54%; height: 54%; }
  .ball span { width: 58%; height: 58%; }
  .stand { width: 140px; height: 70px; background: linear-gradient(#ffd43b, #e0a800); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); margin-top: -8px; }
  .base { width: 260px; height: 22px; border-radius: 12px; background: #e0a800; box-shadow: 0 8px 0 #b38600; }
  .chute { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 70px; height: 24px; background: #e0a800; border-radius: 0 0 14px 14px; z-index: 2; }
  .btn {
    margin-top: 26px; font-family: inherit; font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #4a2f9e;
    background: linear-gradient(#fff36b, #ffd43b); border: none; border-radius: 60px; padding: 16px 46px; cursor: pointer;
    box-shadow: 0 8px 0 #c79600, 0 14px 24px rgba(0,0,0,.35); transition: transform .1s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #c79600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row-btns { display: flex; gap: 10px; margin-top: 14px; }
  .small { font-family: inherit; font-size: 14px; color: #fff; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.35); border-radius: 30px; padding: 6px 16px; cursor: pointer; }
  .count { margin-top: 12px; font-size: 18px; opacity: .9; }

  /* Bola revelada */
  .stage { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20,10,50,.75); backdrop-filter: blur(4px); z-index: 20; }
  .stage.show { display: grid; }
  .big {
    width: min(520px, 88vw); aspect-ratio: 1; border-radius: 50%; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset -26px -30px 0 rgba(0,0,0,.18), inset 18px 18px 0 rgba(255,255,255,.35), 0 30px 60px rgba(0,0,0,.5);
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.7) 0 6%, var(--c) 38%, color-mix(in srgb, var(--c) 65%, #000) 100%) !important;
    animation: pop .7s cubic-bezier(.3,1.5,.5,1) both;
  }
  @keyframes pop { 0% { transform: scale(.85); } 100% { transform: none; } }
  /* Panel de voz */
  .panel { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(20,10,50,.6); backdrop-filter: blur(3px); padding: 16px; }
  .panel.show { display: grid; }
  .panel .box { position: relative; background: #fff; color: #2d2a4a; border-radius: 24px; padding: 26px; width: min(520px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.4); animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
  .panel h3 { font-size: 26px; margin-bottom: 6px; }
  .panel .muted { font-size: 14px; opacity: .7; margin-bottom: 10px; }
  .panel label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .panel input[type=password], .panel select { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid #ddd6ff; border-radius: 12px; }
  .panel input[type=range] { width: 100%; accent-color: #6c5ce7; }
  .panel .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .panel .inline select { flex: 1; }
  .small.dark { color: #6c5ce7; border-color: #ddd6ff; background: #f4f1ff; margin-top: 8px; }
  .mini-btn { font-size: 18px; padding: 10px 24px; margin-top: 8px; }
  .status { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .x { position: absolute; top: 14px; right: 16px; border: none; background: none; font-size: 22px; cursor: pointer; color: #999; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2d2a4a; color: #fff; padding: 10px 18px; border-radius: 20px; z-index: 50; }

  /* Revelado */
  .stage { perspective: 1200px; }
  .rays { position: absolute; width: 160vmax; height: 160vmax; left: 50%; top: 50%; margin: -80vmax 0 0 -80vmax; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--c) 45%, transparent) 0 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%);
    animation: raysIn 1s ease both, raysRot 30s linear infinite; }
  @keyframes raysIn { from { opacity: 0; transform: scale(.3); } }
  @keyframes raysRot { to { rotate: 360deg; } }
  .float { animation: bob 3.2s 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-14px) rotate(1.5deg); } }
  .big { animation: land 1.1s cubic-bezier(.2,.9,.3,1.15) both; transform-style: preserve-3d; overflow: hidden; }
  @keyframes land { 0% { transform: rotateY(-540deg) scale(.9); } 70% { transform: rotateY(15deg) scale(1.04); } 100% { transform: none; } }
  .big::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.75) 48%, transparent 60%);
    background-size: 250% 100%; animation: shine 1.2s 1s ease-in-out both; }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -60% 0; } }
  .big .inner { animation: open .7s .8s cubic-bezier(.3,1.5,.5,1) both; box-shadow: inset 0 6px 14px rgba(0,0,0,.12); }
  @keyframes open { from { transform: scale(0); } }
  .big .L { animation: drop .7s 1.2s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes drop { from { transform: translateY(-60px) scale(.3); opacity: 0; } }
  .big img { animation: wobble .9s 1.4s cubic-bezier(.3,1.6,.5,1) both !important; }
  @keyframes wobble { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.08) rotate(4deg); } 100% { transform: none; } }
  .big .V { animation: none !important; display: flex; }
  .big .V i { font-style: normal; display: inline-block; animation: letter .45s cubic-bezier(.3,1.8,.5,1) both; }
  @keyframes letter { from { transform: translateY(30px) scale(.2); opacity: 0; } }
  .sparkle { position: absolute; color: #fff; pointer-events: none; text-shadow: 0 0 10px #fff; animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
  .stage { transition: opacity .3s; }
  .big .inner { width: 76%; aspect-ratio: 1; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #2d2a4a; }
  .big .L { font-size: clamp(40px, 8vw, 70px); font-weight: 700; line-height: 1; }
  .big img { width: 48%; aspect-ratio: 1; object-fit: cover; border-radius: 22px; margin: 6px 0; animation: fadein .6s .7s both; }
  .big .V { font-size: clamp(34px, 7vw, 62px); font-weight: 700; line-height: 1; animation: fadein .6s .9s both; }
  @keyframes fadein { from { opacity: 0; transform: scale(.6); } }
  .hint { position: absolute; bottom: 24px; width: 100%; text-align: center; opacity: .8; }
  .burst { position: fixed; width: 12px; height: 12px; border-radius: 3px; z-index: 21; pointer-events: none; }

  /* Tablero */
  .board { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 24px; padding: 18px; }
  .board h2 { font-size: 22px; letter-spacing: 3px; margin-bottom: 12px; text-align: center; }
  .last { display: flex; align-items: center; gap: 14px; background: #fff; color: #2d2a4a; border-radius: 18px; padding: 10px 14px; margin-bottom: 14px; min-height: 84px; }
  .last img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; }
  .last .ball { width: 56px; height: 56px; font-size: 26px; }
  .last .txt { font-size: 28px; font-weight: 700; }
  .last .empty { opacity: .6; font-size: 18px; }
  .ball { font-weight: 700; flex: none; }
  .line { display: grid; grid-template-columns: 46px repeat(10, 1fr); gap: 6px; margin-bottom: 8px; align-items: center; }
  .line .ball { width: 42px; height: 42px; font-size: 22px; }
  .chip { background: rgba(255,255,255,.12); border-radius: 12px; text-align: center; padding: 4px 2px; font-size: 12.5px; opacity: .35; transition: all .4s; }
  .chip img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 2px; filter: grayscale(1); }
  .chip.on { opacity: 1; background: #fff; color: #2d2a4a; font-weight: 600; transform: scale(1.06); }
  .chip.on img { filter: none; }
  .chip.new { animation: flash 1.2s 2; }

  /* ===== Franja de créditos con logo ===== */
  .credits { display: flex; align-items: center; justify-content: center; gap: 0; margin: 0 auto 6px; padding: 0 16px; }
  .cr { display: flex; align-items: center; gap: 8px; background: #fff; padding: 5px 16px; box-shadow: 0 8px 22px rgba(60,90,170,.18);
    animation: crIn .8s .6s cubic-bezier(.3,1.4,.5,1) both; }
  .cr small { display: block; font-size: 9px; letter-spacing: 2px; font-weight: 700; color: #8a86b0; }
  .cr strong { display: block; font-size: 17px; line-height: 1.1; color: #2d2a4a; }
  .cr em { font-style: normal; font-size: 11px; font-weight: 600; color: #4dabff; }
  .cr-ico { font-size: 16px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .cr-teacher, .cr-student { width: 250px; height: 52px; box-sizing: border-box; }
  .cr-teacher { justify-content: flex-end; border-radius: 40px 0 0 40px; padding-right: 44px; margin-right: -32px; text-align: right;
    background: linear-gradient(135deg, #fff7d6, #ffffff 60%); border: 3px solid #ffd60a; border-right: none; }
  .cr-teacher .cr-ico { background: #ffe9ef; }
  .cr-teacher small { color: #e08a00; }
  .cr-teacher strong { font-size: 17px; background: linear-gradient(90deg, #ff5fa2, #ff9f1c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cr-student { border-radius: 0 40px 40px 0; padding-left: 44px; margin-left: -32px;
    background: linear-gradient(225deg, #e3f2ff, #ffffff 60%); border: 3px solid #4dabff; border-left: none; }
  .cr-student .cr-ico { background: #e3f2ff; }
  .cr-logo { position: relative; z-index: 2; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; border: 3px solid #ffd60a; box-shadow: 0 0 0 4px #fff, 0 6px 16px rgba(60,90,170,.25);
    animation: logoIn 1s .3s cubic-bezier(.3,1.6,.5,1) both; }
  .cr-logo img { width: 80%; height: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
  @keyframes logoIn { from { transform: scale(0) rotate(-160deg); } }
  @keyframes crIn { from { opacity: 0; transform: scaleX(.6); } }

  /* ===== Tema claro y alegre (colegio) ===== */
  body { color: #2d2a4a; background: linear-gradient(180deg, #a8e2ff 0%, #d9f3ff 45%, #fff5dc 100%); }
  .confetti-bg i { filter: blur(70px); opacity: .35; }
  .confetti-bg i:nth-child(1) { background: #ffb3c4; }
  .confetti-bg i:nth-child(2) { background: #b9c9ff; }
  .confetti-bg i:nth-child(3) { background: #a8f0d4; opacity: .4; }
  .confetti-bg i:nth-child(4) { background: #ffe38a; opacity: .45; }
  .confetti-bg b { opacity: .9; animation: none; background-size: 380px 380px;
    background-image:
      radial-gradient(6px 6px at 8% 15%, #ff4d6d 50%, transparent 52%), radial-gradient(5px 5px at 28% 62%, #ffc233 50%, transparent 52%),
      radial-gradient(6px 6px at 52% 30%, #4f7cff 50%, transparent 52%), radial-gradient(4px 4px at 78% 12%, #1fc98e 50%, transparent 52%),
      radial-gradient(6px 6px at 88% 70%, #ff8c42 50%, transparent 52%), radial-gradient(4px 4px at 66% 88%, #ff4d6d 50%, transparent 52%),
      radial-gradient(5px 5px at 18% 90%, #4f7cff 50%, transparent 52%), radial-gradient(4px 4px at 40% 6%, #1fc98e 50%, transparent 52%); }
  .cloud { position: absolute; width: 180px; height: 60px; background: #fff; border-radius: 60px; opacity: .9;
    box-shadow: 0 8px 20px rgba(80,140,200,.15); animation: cloud linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 80px; height: 80px; top: -40px; left: 25px; }
  .cloud::after { width: 100px; height: 100px; top: -55px; left: 70px; }
  @keyframes cloud { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 260px)); } }
  .credit { color: #4a4370; opacity: 1; font-weight: 600; width: fit-content; margin: 0 auto; padding: 6px 18px; border-radius: 30px; background: rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(60,90,170,.15); }
  .credit b { color: #ff8c42; }
  .board { background: rgba(255,255,255,.8); border: 3px solid #fff; box-shadow: 0 14px 40px rgba(60,90,170,.18); }
  .board h2 { color: #4f7cff; }
  .last { background: #f4f7ff; border: 2px dashed #c9d5ff; }
  .chip { background: #eef2ff; color: #6b6890; opacity: .55; }
  .chip.on { background: #fff; box-shadow: 0 4px 10px rgba(60,90,170,.2); }
  .count { color: #4a4370; font-weight: 600; }
  .small { color: #4f7cff; background: #fff; border-color: #d3dcff; box-shadow: 0 3px 0 #d3dcff; }
  .stage { background: rgba(255,255,255,.55); backdrop-filter: blur(6px); }
  .hint { color: #2d2a4a; opacity: .7; font-weight: 600; }

  /* ===== Tablero nuevo ===== */
  .board { padding: 20px 20px 16px; border-radius: 28px; }
  .board-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .board h2 { margin: 0; font-size: 26px; letter-spacing: 4px; text-align: left;
    background: linear-gradient(90deg, #ff5fa2, #ff9f1c, #ffd60a, #2ee6a6, #4dabff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .counter { background: linear-gradient(135deg, #4dabff, #6a4dff); color: #fff; border-radius: 20px; padding: 4px 14px; box-shadow: 0 4px 0 #3b2fb0; }
  .counter b { font-size: 24px; } .counter span { font-size: 15px; opacity: .85; margin-left: 3px; }
  .progress { height: 10px; border-radius: 10px; background: #e6ebff; overflow: hidden; margin-bottom: 14px; }

  /* ===== Rueda nueva ===== */

  .hub { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd60a 45%, #f0a500); box-shadow: 0 3px 8px rgba(0,0,0,.25); }

    background: linear-gradient(#e6ecff, #a9b8e8); box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .crank .knob { position: absolute; left: 40px; top: 50%; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%;

    background: linear-gradient(#ffffff, #eef2ff); box-shadow: 0 8px 0 #c9d4ff, 0 16px 30px rgba(60,90,170,.25); }
  .base b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 16px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .base b:nth-child(1){background:#ff5fa2} .base b:nth-child(2){background:#ff9f1c} .base b:nth-child(3){background:#ffd60a;color:#7a5c00}
  .base b:nth-child(4){background:#2ee6a6} .base b:nth-child(5){background:#4dabff}
  /* Balotas más claras y vivas */
  .mini, .flyer, .ball {
    background:
      radial-gradient(circle at 30% 24%, #fff 0 7%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 70%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 82%, #000) 100%);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.12), 0 3px 8px rgba(40,60,140,.25); }

  @keyframes flash { 50% { box-shadow: 0 0 0 4px #ffd43b; } }

  /* ===== Celular y tablet ===== */

    /* Tómbola */

  }
</style>
</head>
<body>
<div class="confetti-bg"><i></i><i></i><i></i><i></i><b></b><div class="cloud" style="top:8%;animation-duration:70s;animation-delay:-20s"></div><div class="cloud" style="top:30%;transform:scale(.7);animation-duration:90s;animation-delay:-60s;opacity:.7"></div><div class="cloud" style="top:62%;animation-duration:80s;animation-delay:-45s;opacity:.8"></div></div>
<h1 class="title" aria-label="English Bingo">
  <span class="eng">ENGLISH</span>
  <span class="balls"><i style="--c:#ff5fa2;--d:0s"><b>B</b></i><i style="--c:#ff9f1c;--d:.12s"><b>I</b></i><i style="--c:#ffd60a;--d:.24s"><b>N</b></i><i style="--c:#2ee6a6;--d:.36s"><b>G</b></i><i style="--c:#4dabff;--d:.48s"><b>O</b></i></span>
  <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✧</span>
</h1>
<div class="credits">
  <div class="cr cr-teacher">
    <span class="cr-ico">🍎</span>
    <div><small>ENGLISH TEACHER</small><strong>María I. Puerres</strong></div>
  </div>
  <div class="cr-logo"><img src="logo-colegio.png" alt="Institución Educativa Mercedes Abrego"></div>
  <div class="cr cr-student">
    <div><small>CREATED BY · GRADE 11</small><strong>Sebastián Guerrero</strong></div>
    <span class="cr-ico">✏️</span>
  </div>
</div>

<main>
  <section class="machine">
    <div class="cage-wrap">
      <div class="ring" id="ring"></div>
      <div class="cage" id="cage"><div class="spokes" id="spokes"></div><div class="glass"></div></div>
      <div class="crank" id="crank"><div class="arm"></div><div class="knob"></div></div>
      <div class="chute"></div>
    </div>

    <div class="base"><b>B</b><b>I</b><b>N</b><b>G</b><b>O</b></div>
    <button class="btn" id="draw">¡SACAR BOLA!</button>

    <div class="row-btns">
      <button class="small" id="voice">🔊 Voz: sí</button>
      <button class="small" id="reset">↺ Nuevo juego</button>

  <section class="board">

      <h2>CALLED BALLS</h2>

</main>

<div class="stage" id="stage">

  <div class="float"><div class="big" id="big"></div></div>
  <div class="hint">Toca en cualquier parte para continuar</div>
</div>

<script>
const ALL = [];
LETTERS.forEach(l => VERBS[l].forEach(([v, f]) => ALL.push({ l, v, f, id: l + "-" + v })));
const KEY = "english-bingo-drawn";
let drawn = [];
try { drawn = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
let voiceOn = true;
const textColor = l => l === "N" ? "#5a4500" : "#fff";

// ---- Tómbola con física: las bolas caen, rebotan y chocan ----
const cage = document.getElementById("cage");
const spokes = document.getElementById("spokes");
const ring = document.getElementById("ring"), crank = document.getElementById("crank");
const BR = 18; // radio de cada bolita
let balls = [], spin = 0, angle = 0;
function fillCage() {
  balls.forEach(b => b.el.remove());
  const S = cage.clientWidth, C = S / 2;
  balls = ALL.filter(b => !drawn.includes(b.id)).map(b => {
    const el = document.createElement("div");
    el.className = "mini"; el.style.setProperty("--c", LETTER_COLORS[b.l]);
    el.innerHTML = `<span>${b.l}</span>`;
    cage.appendChild(el);
    return { b, el, x: C + (Math.random() - .5) * C, y: C + Math.random() * C * .6, vx: 0, vy: 0, rot: Math.random() * 360 };
  });
}
function step() {
  const S = cage.clientWidth, C = S / 2, R = C - 10 - BR; // 10 = borde
  angle += spin * 6;
  spokes.style.transform = `rotate(${angle}deg)`;
  ring.style.transform = `rotate(${angle * .5}deg)`;
  crank.style.transform = `translateY(-50%) rotate(${angle}deg)`;
  for (const p of balls) {
    p.vy += 0.45; // gravedad
    if (spin > 0) { // remolino: empuja en círculo y hacia arriba
      const dx = p.x - C, dy = p.y - C;
      p.vx += (-dy / C) * 1.6 * spin + (Math.random() - .5) * 1.2 * spin;
      p.vy += (dx / C) * 1.6 * spin - 0.5 * spin + (Math.random() - .5) * 1.2 * spin;
    }
    p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy;
    const dx = p.x - C, dy = p.y - C, d = Math.hypot(dx, dy);
    if (d > R) { // choque con la pared
      const nx = dx / d, ny = dy / d;
      p.x = C + nx * R; p.y = C + ny * R;
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) { p.vx -= 1.7 * vn * nx; p.vy -= 1.7 * vn * ny; }
      p.vx += -ny * spin * 1.2; p.vy += nx * spin * 1.2; // la pared arrastra al girar
    }
  }
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) { // choques entre bolas
    const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < BR * 2) {
      const nx = dx / d, ny = dy / d, o = (BR * 2 - d) / 2;
      a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { const k = -rv * 0.9; a.vx -= k * nx; a.vy -= k * ny; b.vx += k * nx; b.vy += k * ny; }
    }
  }
  for (const p of balls) {
    p.rot += p.vx * 3;
    p.el.style.transform = `translate(${p.x - BR}px, ${p.y - BR}px) rotate(${p.rot}deg)`;
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
function setSpin(target, ms) { // sube o baja la velocidad suavemente
  const from = spin, t0 = performance.now();
  return new Promise(res => {
    (function f(t) {
      const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      spin = from + (target - from) * e;
      k < 1 ? requestAnimationFrame(f) : res();
    })(t0);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// Tablero
const lines = document.getElementById("lines");
lines.innerHTML = LETTERS.map(l =>
  `<div class="line" style="--c:${LETTER_COLORS[l]}"><div class="ball" style="--c:${LETTER_COLORS[l]}"><span>${l}</span></div>` +
  VERBS[l].map(([v, f]) => `<div class="chip" id="c-${l}-${v}"><img src="${imgUrl(f, 120)}" alt="">${v}</div>`).join("") +
  `</div>`).join("");

function refresh(newId) {
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", drawn.includes(c.id.slice(2))));
  if (newId) { const c = document.getElementById("c-" + newId); c.classList.add("new"); setTimeout(() => c.classList.remove("new"), 2500); }
  document.getElementById("count").textContent = `Salieron ${drawn.length} de ${ALL.length} bolas`;
  document.getElementById("draw").disabled = drawn.length === ALL.length;
  document.getElementById("bcount").textContent = drawn.length;
  document.getElementById("bar").style.width = (drawn.length / ALL.length * 100) + "%";
  const find = id => ALL.find(x => x.id === id);
  const b = find(drawn[drawn.length - 1]);
  const prev = drawn.slice(-6, -1).reverse().map(find);
  document.getElementById("last").innerHTML = b
    ? `<div class="now" style="--c:${LETTER_COLORS[b.l]}">
         <div class="tag">LAST BALL</div>
         <div class="ball big-b" style="--c:${LETTER_COLORS[b.l]}"><span>${b.l}</span></div>
         <img src="${imgUrl(b.f, 160)}" alt="">
         <div class="txt"><small>${b.l}</small>${b.v}</div>
       </div>
       <div class="prev">${prev.length ? `<div class="tag">BEFORE</div>` : ""}${prev.map(p =>
         `<div class="pb" title="${p.l} ${p.v}"><div class="ball" style="--c:${LETTER_COLORS[p.l]}"><span>${p.l}</span></div><em>${p.v}</em></div>`).join("")}</div>`
    : `<span class="empty">🎱 Press <b>“¡SACAR BOLA!”</b> to start the game</span>`;
  try { localStorage.setItem(KEY, JSON.stringify(drawn)); } catch (e) {}
}

// ---------- VOZ ----------
// Reproduce audio/B-steal.mp3 (generados con ElevenLabs por generar-audios.js).
// Si el archivo no existe, usa la voz del navegador (lenta y con pausas).
let currentAudio = null;

function browserSay(l, v) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const voices = speechSynthesis.getVoices().filter(x => x.lang.startsWith("en"));
  const best = voices.find(x => /natural|online|google us/i.test(x.name)) || voices[0];
  const mk = (t, rate) => { const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = rate; if (best) u.voice = best; return u; };
  speechSynthesis.speak(mk(l, .7));
  setTimeout(() => speechSynthesis.speak(mk(v, .65)), 1200); // pausa entre letra y verbo
  setTimeout(() => speechSynthesis.speak(mk(v, .65)), 3200); // lo repite una vez
}

async function say(l, v) {
  if (!voiceOn) return;
  if (currentAudio) currentAudio.pause();
  try {
    currentAudio = new Audio(`audio/${l}-${v}.mp3`);
    await currentAudio.play();
  } catch (e) {
    browserSay(l, v);
  }
}
// Precarga el audio de la bola mientras la tómbola gira
function preloadAudio(l, v) { const a = new Audio(`audio/${l}-${v}.mp3`); a.preload = "auto"; }


function confetti(color) {
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div"); p.className = "burst";
    p.style.background = [color, "#ffd43b", "#fff", "#38d9a9", "#ff6b8b"][i % 5];
    p.style.left = "50vw"; p.style.top = "50vh"; document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 400;
    p.animate([{ transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 200}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
      { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.1,.8,.3,1)", delay: 900 }).onfinish = () => p.remove();
  }
}

const btn = document.getElementById("draw");
btn.onclick = async () => {
  if (!balls.length) return;
  btn.disabled = true;
  await setSpin(1, 700);      // arranca a girar
  await wait(1600);           // gira a tope
  const idx = Math.floor(Math.random() * balls.length);
  const p = balls[idx], pick = p.b;
  new Image().src = imgUrl(pick.f, 360); // precarga el dibujo
  preloadAudio(pick.l, pick.v);
  // la bola elegida sale por la boca de abajo
  const r = p.el.getBoundingClientRect();
  balls.splice(idx, 1); p.el.remove();
  setSpin(0, 1200);
  const fl = document.createElement("div");
  fl.className = "flyer"; fl.style.setProperty("--c", LETTER_COLORS[pick.l]);
  const size = 36; fl.style.width = fl.style.height = size + "px"; fl.style.left = r.left + "px"; fl.style.top = r.top + "px";
  fl.innerHTML = `<span style="font-size:15px">${pick.l}</span>`;
  document.body.appendChild(fl);
  const cr = cage.getBoundingClientRect();
  const chuteX = cr.left + cr.width / 2 - size / 2 - r.left, chuteY = cr.bottom + 10 - r.top;
  await fl.animate([
    { transform: "translate(0,0) rotate(0)" },
    { transform: `translate(${chuteX}px, ${chuteY - 30}px) rotate(200deg)`, offset: .55 },
    { transform: `translate(${chuteX}px, ${chuteY}px) rotate(260deg)` }
  ], { duration: 650, easing: "cubic-bezier(.5,0,.8,1)", fill: "forwards" }).finished;
  // rebota y vuela al centro mientras crece
  const target = Math.min(520, innerWidth * .88), sc = target / size;
  const cx = innerWidth / 2 - size / 2 - r.left, cy = innerHeight / 2 - size / 2 - r.top;
  const stage = document.getElementById("stage");
  stage.style.opacity = 0; stage.classList.add("show");
  stage.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: "forwards" });
  document.getElementById("big").style.visibility = "hidden";
  await fl.animate([
    { transform: `translate(${chuteX}px, ${chuteY}px) rotate(260deg) scale(1)` },
    { transform: `translate(${(chuteX + cx) / 2}px, ${Math.min(chuteY, cy) - 120}px) rotate(500deg) scale(${sc * .4})`, offset: .5 },
    { transform: `translate(${cx}px, ${cy}px) rotate(720deg) scale(${sc})` }
  ], { duration: 900, easing: "cubic-bezier(.3,.1,.2,1)", fill: "forwards" }).finished;
  // se abre la bola grande
  drawn.push(pick.id);
  const big = document.getElementById("big");
  big.style.setProperty("--c", LETTER_COLORS[pick.l]);
  document.getElementById("rays").style.setProperty("--c", LETTER_COLORS[pick.l]);
  const letters = [...pick.v].map((ch, i) => `<i style="animation-delay:${1.7 + i * .09}s">${ch}</i>`).join("");
  const sparkles = Array.from({ length: 8 }, (_, i) => {
    const a = i / 8 * Math.PI * 2;
    return `<div class="sparkle" style="left:${50 + 47 * Math.cos(a)}%;top:${50 + 47 * Math.sin(a)}%;font-size:${16 + (i % 3) * 8}px;animation-delay:${1.5 + i * .2}s">✦</div>`;
  }).join("");
  big.innerHTML = `<div class="inner"><div class="L" style="color:${pick.l === "N" ? "#e0a800" : LETTER_COLORS[pick.l]}">${pick.l}</div><img src="${imgUrl(pick.f, 360)}" alt=""><div class="V">${letters}</div></div>${sparkles}`;
  ["big", "rays"].forEach(id => { const e = document.getElementById(id); e.style.animation = "none"; e.offsetWidth; e.style.animation = ""; });
  big.style.visibility = "visible";
  fl.remove(); stage.style.opacity = 1;
  confetti(LETTER_COLORS[pick.l]);
  setTimeout(() => say(pick.l, pick.v), 1300);
  refresh(pick.id);
};
document.getElementById("stage").onclick = () => {
  document.getElementById("stage").classList.remove("show");
  btn.disabled = drawn.length === ALL.length;
};
document.getElementById("reset").onclick = () => {
  if (!confirm("¿Empezar un juego nuevo? Se borrarán las bolas que ya salieron.")) return;
  drawn = []; fillCage(); refresh();
};
document.getElementById("voice").onclick = e => {
  voiceOn = !voiceOn; e.target.textContent = "🔊 Voz: " + (voiceOn ? "sí" : "no");
};
fillCage(); refresh();
</script>
</body>
</html>
